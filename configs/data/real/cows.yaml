# @package data
defaults:
  - real/base
  - _self_

type: real

experiment:
  name: cows
  response_name: protein
  seed: 0
  split_data_seed: 0

provider:
  _target_: src.data.generator.CowsDataProvider

  transforms:
  - _target_: src.data.transforms.Standardizer
    columns: ["time"]
  - _target_: src.data.transforms.DummyEncoder
    columns: ["diet"]
  response_column_names: ["protein"]
  min_group_size: 10

split_params:
  in_context_validation_size: 0.25
  in_context_test_size: 0.25
  n_validation_groups: 15
  n_test_groups: 15
  n_support_validation: 7
  n_support_test: 7
