# @package data
defaults:
  - synthetic/base
  - synthetic/fixed_effect: steps_2D
  - synthetic/random_effect: GP_rbf
  - synthetic/noise: homoscedastic_gaussian
  - _self_

synthetic:
  noise:
    std: 0.5


experiment:
  name: gp_gaussian_irrelevant_x
  seed: 42
  split_data_seed: 0

n_subjects: 600
n_observations_per_subject: 100
n_irrelevant_features: 2


split_params:
  in_context_validation_size: 0.25
  in_context_test_size: 0.25
  n_validation_groups: 100
  n_test_groups: 100
  n_support_validation: 20
  n_support_test: 20
  seed_list: ${data.generation_seed_list}
