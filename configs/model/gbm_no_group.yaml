_target_: src.training.experiment_runner.GradientBoostingExperiment
name: gbm_no_group
wandb_enabled: ${wandb.enabled}
group_as_cat: false

max_boosting_rounds: 500
validation_metric: rmse
min_delta: 0.00001
patience: 25
restore_best_model: true

train_params:
  learning_rate: 0.05
  feature_fraction: 1.0
  lambda_l2: 0
  min_data_in_leaf: 20
  num_leaves: 5
  max_bin: 255
  max_depth: -1
  line_search_step_length: false
  objective: "regression"
  verbose: 0
  boosting_type: "gbdt"
  seed: ${data.experiment.seed}
  deterministic: true
  num_threads: 1
